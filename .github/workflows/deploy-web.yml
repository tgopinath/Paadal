name: Deploy web app

# Builds the web version and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://tgopinath.github.io/Paadal/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Build web app
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Set these under Settings → Secrets and variables → Actions → Variables.
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY }}

      - name: Prepare for GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # serve the app for deep links
          touch dist/.nojekyll               # keep the _expo folder

      # gh-pages holds only generated build output, so each deploy replaces it.
      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
