<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Amazon Pulse</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#fff;color:#1f2328;padding:24px}
  main{max-width:360px;text-align:center}
  img{width:56px;height:56px;border-radius:14px}
  p{color:#6b7280;font-size:14px;line-height:1.5}
  button{margin-top:8px;height:40px;padding:0 18px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 style="font-size:20px">You're offline</h1>
  <p>Amazon Pulse needs a connection to load current snapshots. It doesn't show stale numbers as if they were current.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
